<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ahmad Qadoura — Senior Frontend Engineer and Founder">
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
      @keyframes ring { 0% { r: 5; opacity: .6; } 100% { r: 13; opacity: 0; } }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
      .ring { animation: ring 2.4s ease-out infinite; }
    </style>
    <radialGradient id="glowV" cx="88%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#7C6CF2" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#7C6CF2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#3B6EF5" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#3B6EF5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity=".05"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C77A"/>
      <stop offset="100%" stop-color="#9B7BF7"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9CCF5"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0A0C11"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowV)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="20" fill="none" stroke="#232838"/>

  <!-- left column -->
  <text x="64" y="78" class="mono" font-size="13" letter-spacing="2.5" fill="#6B7285">AMMAN, JORDAN  ·  FRONTEND  ·  PRODUCT  ·  FOUNDER</text>
  <text x="62" y="148" class="sans" font-size="60" font-weight="700" letter-spacing="-1.5" fill="url(#name)">Ahmad Qadoura</text>
  <text x="64" y="192" class="sans" font-size="21" font-weight="500" fill="#AEB4F2">Senior Frontend &amp; Platform Engineer  ·  Founder of ATS Hiring &amp; QRWindow</text>
  <text x="64" y="228" class="sans" font-size="18" fill="#8A90A2">I don’t just build websites. I build the business behind them.</text>

  <!-- status pill -->
  <g transform="translate(64 254)">
    <rect width="318" height="34" rx="17" fill="#11141C" stroke="#262C3C"/>
    <circle cx="20" cy="17" r="5" fill="#3DD68C" class="ring"/>
    <circle cx="20" cy="17" r="4.5" fill="#3DD68C" class="dot"/>
    <text x="36" y="22" class="sans" font-size="14" fill="#C7CBD6">Shipping products from Amman → MENA</text>
  </g>

  <!-- monogram -->
  <g transform="translate(940 70)">
    <rect x="0" y="0" width="180" height="180" rx="36" fill="#0F1219"/>
    <rect x=".75" y=".75" width="178.5" height="178.5" rx="35.5" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity=".8"/>
    <text x="90" y="112" text-anchor="middle" class="sans" font-size="64" font-weight="700" letter-spacing="-2" fill="url(#gold)">AQ</text>
    <text x="90" y="150" text-anchor="middle" class="mono" font-size="12" letter-spacing="2" fill="#5D6477">AHMADQ.DEV</text>
  </g>
</svg>
